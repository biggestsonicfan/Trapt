# CI for code.robkrum.com/rob/Trapt
#
# Most of this repository cannot be tested without the disc: the decoders are
# checked by diffing them against the Python over real game data, and the ELF
# supplies the story tables, the font and the filename table.  None of that
# belongs on a runner, so those suites skip themselves (exit 2) and the job
# still passes -- 239 checks here against 682 with a disc in hand.
#
# What does run is the half that has actually caught shipped bugs:
#
#   * every browser module loads the way a browser loads it -- one shared
#     global scope, not one module scope each.  iso.js and disc.js once both
#     declared `u32` and `api` at top level, so the second tag died with a
#     redeclaration error and the page failed with "TraptDisc is not defined"
#     while every test passed.
#   * the GS shaders in tools/web/gs.js are still byte-identical to the ones
#     in tools/player.html, which is the only thing keeping two copies honest.
#   * pick.html's initialisation order, which broke route mode's play button
#     and its audio in one line -- and now also stage mode's, where the follow
#     camera and the orbit camera would otherwise fight for the frame.
#   * the PCSX2 pad binding tables, where a transposed pair silently swaps
#     Circle and Cross and the game gets the blame.  That one needs no disc
#     because a PCSX2.ini is not game data.
#
# One job on one small image.  The droplet has disk to spare (48 GB, about 18
# free) but only 1 GB of memory, already with swap in use, so the point is to
# be cheap while running rather than small on disk: one container instead of
# two, node:20-bookworm-slim at about 240 MB, and a measured 256 MB cap on the
# job -- the suites peak near 50 MB of RSS.  git and python3 go in before the
# checkout, because the slim image has neither and installing them does not
# need the repository.
#
# Forgejo reads .forgejo/workflows first and falls back to .github/workflows.
# It needs a registered runner; see deploy/docker-compose.runner.yml.
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: docker
    container:
      image: node:20-bookworm-slim
    steps:
      - name: what the slim image is missing
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends git ca-certificates python3
          node --version && git --version && python3 --version

      - uses: actions/checkout@v4

      - name: every browser module parses
        run: for f in tools/web/*.js; do node --check "$f"; done

      - name: the suites that need no disc
        run: node tools/web/test_all.js --no-disc

      - name: every tool compiles
        run: python3 -m compileall -q tools deploy

      - name: the served tree still builds
        run: |
          python3 deploy/build-web.py "$RUNNER_TEMP/trapt-web" --prune
          test -s "$RUNNER_TEMP/trapt-web/index.html"

      - name: the docs point at files that exist
        run: |
          python3 - <<'EOF'
          import os, re, sys
          bad = []
          for root, _, files in os.walk('docs'):
              for f in files:
                  if not f.endswith('.md'):
                      continue
                  p = os.path.join(root, f)
                  text = open(p, encoding='utf-8').read()
                  for link in re.findall(r'\]\(([^)#]+)[^)]*\)', text):
                      if link.startswith(('http', 'mailto:')):
                          continue
                      t = os.path.normpath(os.path.join(root, link))
                      if not os.path.exists(t):
                          bad.append('%s -> %s' % (p, link))
          print('\n'.join(bad) or 'every relative link resolves')
          sys.exit(1 if bad else 0)
          EOF
