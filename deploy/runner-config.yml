# Forgejo runner config -- copy to runner/config.yml beside the .runner file
# that `forgejo-runner register` writes.
#
# Sized for a 1 vCPU / 1 GB droplet already carrying Forgejo, Caddy and
# decomp.me, and already using swap.  Disk is not the constraint (48 GB, about
# 18 GB free); memory is.
#
# The job cap is measured, not guessed: each suite peaks around 50 MB of RSS
# and they run one at a time, so 256 MB is comfortable headroom for node plus
# the apt-get in the first step.  These are ceilings, not reservations -- the
# runner idles at a few tens of megabytes and only spends anything while a job
# is actually running.
#
# `docker image prune -f` is worth a cron entry: job containers are removed as
# they finish, pulled images are not.

log:
  level: info

runner:
  # One at a time.  Two concurrent jobs on one vCPU is slower than one, and
  # each holds its own container.
  capacity: 1
  timeout: 15m
  shutdown_timeout: 30s
  # Whether to pull the job image every run.  false keeps the disk quiet and
  # the network idle once the image is there.
  fetch_timeout: 5s
  fetch_interval: 10s
  # Must match `runs-on:` in the workflow.  The image after `docker://` is the
  # default for a job that does not name its own container.
  labels:
    - "docker:docker://node:20-bookworm-slim"

cache:
  # actions/cache needs a server the job containers can reach.  Off, because
  # this repository's CI installs two apt packages and runs node -- there is
  # nothing worth caching, and the server would want a port and a directory.
  enabled: false

container:
  # The default bridge.  A job needs to reach the Forgejo instance to clone,
  # and the runner is registered against the public URL, so the bridge is
  # enough.  Registering internally instead would mean putting jobs on
  # `forgejo_forgejo` here so `server` resolves for them too.
  network: ""
  privileged: false
  options: "--memory=256m --cpus=1"
  # Only the workspace is shared in.
  valid_volumes: []
  docker_host: "unix:///var/run/docker.sock"
  force_pull: false

host:
  workdir_parent: /data/workspace
