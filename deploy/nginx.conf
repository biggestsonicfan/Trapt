# trapt.robkrum.com -- for a box that already runs nginx.
# Drop in /etc/nginx/sites-available/trapt.robkrum.com and symlink it.
#
# `gzip_static on` serves the .gz sidecars deploy/precompress.py writes rather
# than compressing 18 MB on every request; without them nginx falls back to
# compressing on the fly, which is why gzip_types still lists the JS.

server {
    listen 80;
    listen [::]:80;
    server_name trapt.robkrum.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name trapt.robkrum.com;

    # certbot, or a Cloudflare origin certificate if the record is proxied
    ssl_certificate     /etc/letsencrypt/live/trapt.robkrum.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/trapt.robkrum.com/privkey.pem;

    root /srv/trapt-site;
    index index.html;

    gzip_static on;
    gzip on;
    gzip_types application/javascript text/html application/json;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # rebuilt every time, small: revalidate
    location = /index.html   { add_header Cache-Control "public, max-age=300, must-revalidate"; }
    location = /script.html  { add_header Cache-Control "public, max-age=300, must-revalidate"; }
    location = /order.js     { add_header Cache-Control "public, max-age=300, must-revalidate"; }
    location = /manifest.json { add_header Cache-Control "public, max-age=300, must-revalidate"; }

    # one cutscene's data: big, and unchanged unless the exporter changes
    location ~ /scene\.js$   { add_header Cache-Control "public, max-age=604800"; }
    location ~ /poster\.png$ { add_header Cache-Control "public, max-age=604800"; }
    location = /three.min.js { add_header Cache-Control "public, max-age=604800"; }

    location / {
        try_files $uri $uri/ =404;
    }
}
