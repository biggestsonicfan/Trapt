# trapt.robkrum.com on the droplet that already runs Forgejo and decomp.me.
#
# This does NOT terminate TLS and does NOT publish a port.  It joins the
# network your existing Caddy is already on and answers to the name `trapt`,
# exactly like `server:3000` and `decompme-nginx:80` do in your Caddyfile.
# Add one block to ~/forgejo/Caddyfile:
#
#     trapt.robkrum.com {
#         reverse_proxy trapt:8080
#     }
#
# then `docker compose exec caddy caddy reload --config /etc/caddy/Caddyfile`
# (or restart the caddy service).
#
# Deliberately the bind-mounted shape, not the baked image: on a 25 GB droplet
# a ~0.95 GB image layer on top of a ~0.89 GB directory is a gigabyte spent
# for nothing, and rsync updates the site without a rebuild.
#
#   NET=forgejo_default TRAPT_SITE=/srv/trapt-site \
#     docker compose -f docker-compose.droplet.yml up -d
#
# Check the network name first -- it is the compose project directory plus
# `_default`, so `docker network ls | grep -i caddy` or inspect the caddy
# container: `docker inspect caddy --format '{{json .NetworkSettings.Networks}}'`
name: trapt

services:
  trapt:
    image: caddy:2-alpine
    container_name: trapt
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - ./Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - ${TRAPT_SITE:-/srv/trapt-site}:/srv/trapt-site:ro
    networks:
      - web
    restart: unless-stopped
    # 1 GB of RAM shared with Forgejo and decomp.me: keep this one boxed in.
    # Static file serving needs almost nothing.
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/index.html"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  web:
    external: true
    name: ${NET:-forgejo_default}
