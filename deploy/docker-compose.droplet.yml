# trapt.robkrum.com on the droplet that already runs Forgejo and decomp.me.
#
# This does NOT terminate TLS and does NOT publish a port.  It joins the
# `proxy` network your Caddy is already on -- the same one `decompme-nginx` is
# reached over -- and answers to the name `trapt`.  Add one block to
# ~/forgejo/Caddyfile:
#
#     trapt.robkrum.com {
#         reverse_proxy trapt:8080
#     }
#
# then reload Caddy:
#
#     docker compose -f ~/forgejo/docker-compose.yml exec caddy \
#       caddy reload --config /etc/caddy/Caddyfile
#
# and bring this up:
#
#     TRAPT_SITE=/srv/trapt-site docker compose -f docker-compose.droplet.yml up -d
#
# `proxy` is declared `external: true` in ~/forgejo/docker-compose.yml, so it
# already exists and is not owned by that stack -- joining it disturbs nothing.
# `docker network ls` if anything ever moves.
#
# Bind-mounted rather than a baked image.  The disk has room for either (48 GB,
# about 18 GB free), but the image would be a second copy of bytes already on
# disk and rsync updates the site without a rebuild.  Memory is the tighter
# resource here: 1 GB, around 57% used with swap already in play, which is why
# this is capped -- though serving static files barely registers.
name: trapt

services:
  trapt:
    image: caddy:2-alpine
    container_name: trapt
    command: ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
    volumes:
      - ./Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - ${TRAPT_SITE:-/srv/trapt-site}:/srv/trapt-site:ro
    networks:
      - proxy
    restart: unless-stopped
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/index.html"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  proxy:
    external: true
    name: ${NET:-proxy}
